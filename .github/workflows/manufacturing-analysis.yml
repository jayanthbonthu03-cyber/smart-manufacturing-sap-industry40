name: Manufacturing Analysis

on:
  push:
    paths:
      - 'data/**'
      - 'src/**'
      - '.github/workflows/manufacturing-analysis.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'src/**'
      - '.github/workflows/manufacturing-analysis.yml'
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run manufacturing analysis
        run: python src/production_analysis.py

      - name: Generate manufacturing charts
        run: python src/create_charts.py

      - name: Upload manufacturing charts
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-charts
          path: charts/
