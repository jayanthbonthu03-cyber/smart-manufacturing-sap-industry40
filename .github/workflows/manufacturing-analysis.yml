name: Manufacturing Analysis

on:
  push:
    paths:
      - 'data/**'
      - 'src/**'
      - 'charts/**'
      - '.github/workflows/manufacturing-analysis.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'src/**'
      - 'charts/**'
      - '.github/workflows/manufacturing-analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run manufacturing analysis
        run: python src/production_analysis.py

      - name: Generate manufacturing charts
        run: python src/create_charts.py

      - name: Upload manufacturing charts
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-charts
          path: charts/*.svg

      - name: Commit generated chart
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
         git add charts/machine_downtime.svg charts/product_quality.svg
          git diff --cached --quiet || git commit -m "Update generated manufacturing chart"
          git push
    
